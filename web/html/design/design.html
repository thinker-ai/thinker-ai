<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Chat</title>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/prismjs@1.25.0/themes/prism-okaidia.css"/>
    <link rel="stylesheet" type="text/css" href="../../static/design/design.css">
    <script type="module" src="../../js/design/design.js"></script> <!-- 使用 TypeScript 编译后的 JavaScript 文件 -->
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        table, th, td {
            border: 1px solid #ddd;
        }
        th, td {
            padding: 8px;
            text-align: left;
        }
        tbody tr:hover {
            background-color: #f1f1f1;
        }
        .selected {
            background-color: #d4edda !important; /* 绿色高亮 */
        }
        .delete-btn {
            color: red;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="list">
        <table>
            <thead>
                <tr>
                    <th>流程ID</th>
                    <th>流程标题</th>
                    <th>是否完成</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="process-table-body"></tbody>
        </table>
    </div>
    <div id="content">
       <div id="main-sidebar">
                <button class="menu-item active" onclick="showContent('content-frame','menu-item','/design/solution',this);">流程描述</button>
                <button class="menu-item" onclick="showContent('content-frame','menu-item','/design/resources',this);">资源配置</button>
                <button class="menu-item" onclick="showContent('content-frame','menu-item','/design/strategy',this);">思维模式配置</button>
                <button class="menu-item" onclick="showContent('content-frame','menu-item','/design/criterion',this);">行动偏好与准则配置</button>
       </div>
        <div id="main-content">
            <iframe id="content-frame"></iframe>
        </div>
    </div>
</body>
</html>
